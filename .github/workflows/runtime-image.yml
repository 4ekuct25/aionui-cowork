name: session-runtime image

on:
  push:
    branches: [dockerize]
    # The runtime image now bundles dist-server (worker entry points), so
    # any change that affects the build:server output must trigger a rebuild.
    paths:
      - 'Dockerfile.session-runtime'
      - 'resources/container-bootstrap/**'
      - 'resources/aionrs-linux-**'
      - '.github/workflows/runtime-image.yml'
      - 'scripts/build-server.mjs'
      - 'src/server.ts'
      - 'src/process/worker/**'
      - 'src/process/agent/**'
      - 'src/common/platform/**'
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/aionui-cowork-runtime
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dockerize' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.session-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
