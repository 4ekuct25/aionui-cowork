# aionui-cowork — single-VM deployment stack.
#
# Quick start (see DEPLOY.md for the full walkthrough):
#   1. cp .env.example .env  &&  edit secrets
#   2. docker compose pull   (or `docker compose build` from source)
#   3. docker compose up -d
#   4. open https://<host>:3000   — local signup is enabled by default;
#      the first registered user becomes admin.
#
# Multi-arch images are published to GHCR by the dockerize branch workflows.
# The compose stack runs everything on one Docker daemon; per-conversation
# sandbox containers spawn as siblings via the bind-mounted docker.sock.

services:
  app:
    # Pull the prebuilt control-plane image by default. `docker compose build`
    # falls back to the local Dockerfile when an image rebuild is required
    # (e.g. when iterating locally).
    image: ${CONTROL_PLANE_IMAGE:-ghcr.io/4ekuct25/aionui-cowork-control-plane:dev}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aionui-cowork-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Hard-pin platform mode so DockerPlatformServices is wired even if the
      # operator's .env forgets it. Anything else here is intentionally
      # plumbed via env_file so secrets stay out of source control.
      AIONUI_PLATFORM: docker
      ALLOW_REMOTE: 'true'
      NODE_ENV: production
      DATA_DIR: /data
      # Image consumed by DockerSessionManager when it spins up a per-chat
      # sandbox. Override per-deployment via .env (e.g. pin to a sha tag).
      SESSION_RUNTIME_IMAGE: ${SESSION_RUNTIME_IMAGE:-ghcr.io/4ekuct25/aionui-cowork-runtime:dev}
      # dockerode reads DOCKER_HOST automatically via our parseDockerHost
      # helper. Pointing at the proxy keeps the control-plane off the raw
      # socket — see the `docker-proxy` service below.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Phase 9.1b: sweep every 15 minutes. Each tick reconciles stale DB
      # rows, idle-stops containers untouched past SESSION_IDLE_TIMEOUT_MS,
      # and force-removes orphan containers/volumes whose conversation is gone.
      SESSION_GC_CRON: '0 */15 * * * *'
      # Phase 9.3: stop session containers idle for >30 min so a long-running
      # deployment doesn't leak ~1 GiB RAM per chat. Volume + DB row stay so
      # reopening the chat just rebuilds a fresh container against the same
      # workspace. Override or set to 0 to disable idle eviction.
      SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-1800000}
    depends_on:
      docker-proxy:
        condition: service_started
    volumes:
      # Phase 8.2: app no longer touches /var/run/docker.sock directly.
      # It talks to the tecnativa/docker-socket-proxy service over the
      # internal compose network with a narrow API whitelist instead.
      - app-data:/data
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      # The /api/health endpoint returns 200 once the SQLite probe succeeds.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Pre-pull the session-runtime image so DockerSessionManager finds it
  # locally on first acquire. Run once: `docker compose --profile build-only run --rm session-runtime-puller`.
  session-runtime-puller:
    image: ${SESSION_RUNTIME_IMAGE:-ghcr.io/4ekuct25/aionui-cowork-runtime:dev}
    profiles: ['build-only']
    command: ['true']

  # Local build target for the session-runtime image (multi-stage with the
  # worker bundle). Use when iterating on Dockerfile.session-runtime locally.
  session-runtime-builder:
    build:
      context: .
      dockerfile: Dockerfile.session-runtime
    image: ${SESSION_RUNTIME_IMAGE:-ghcr.io/4ekuct25/aionui-cowork-runtime:dev}
    profiles: ['build-only']
    command: ['true']

  # docker-socket-proxy — Phase 8.2 hardening. Sits between the
  # control-plane and the host Docker daemon and exposes ONLY the API
  # endpoints we actually need (containers / exec / volumes / images).
  # If the control-plane ever gets a foothold (RCE, supply-chain attack,
  # etc.) the blast radius is bounded by this allowlist — no
  # `/networks/create --privileged`, no `/swarm`, no `/secrets`.
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: aionui-cowork-docker-proxy
    restart: unless-stopped
    environment:
      # Required for DockerSessionManager: lifecycle, exec, volume mounting,
      # image existence checks. POST=1 is needed because containers/volumes
      # have to be created, not just inspected.
      CONTAINERS: 1
      EXEC: 1
      VOLUMES: 1
      IMAGES: 1
      POST: 1
      # Refuse anything we don't use — defence in depth.
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 1
      INFO: 1
      NETWORKS: 0
      NODES: 0
      PING: 1
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Only reachable on the compose-internal network — never exposed to
    # the host's external interfaces.
    expose:
      - '2375'

volumes:
  app-data: {}
